[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "git-tape"
version = "0.1.0"
description = "Turn a GitHub contribution calendar into a deterministic 7-pixel-high scrolling tape."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GNU GENERAL PUBLIC LICENSE Version 3"}
authors = [{name = "Ada Arch"}]
dependencies = []

[project.scripts]
git-tape = "git_tape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9,<0.17", "build>=1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
